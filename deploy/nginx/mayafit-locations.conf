# MayaFit (__AMB__): o que todo endereço (principal, admin, <estudio>.<dominio base>, domínio próprio) serve.
# Incluído em cada bloco 443 pelo deploy/certificados.sh (copiado para /etc/nginx/snippets/mayafit-__AMB__-locations.conf).
client_max_body_size 12m;   # uploads (fotos, documentos) até 10 MB + margem

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Strict-Transport-Security "max-age=31536000" always;
server_tokens off;

# Login e recuperação de senha: limite apertado por IP (a API tem o seu próprio limite além deste)
location ~ ^/bff/auth/(login|forgot|reset|forgot-codigo|reset-codigo|primeiro-acesso)$ {
    limit_req zone=mayafit___AMB___auth burst=10 nodelay;
    proxy_pass http://127.0.0.1:__WEB__;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;   # sobrescreve: o cliente não forja o próprio IP
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
}

# Partes da API expostas direto à internet (autenticação própria): integração externa, app do aluno, webhooks
# (TotalPass, Wellhub, Mercado Pago), agente local da catraca, link assinado e health. O estúdio sai do endereço.
location ~ ^/api/(integracao|aluno-app|webhooks|catraca-agente|arquivos-publicos|health)(/|$) {
    limit_req zone=mayafit___AMB___geral burst=40 nodelay;
    proxy_pass http://127.0.0.1:__API__;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
}
location = /api/public/mercadopago {
    limit_req zone=mayafit___AMB___geral burst=40 nodelay;
    proxy_pass http://127.0.0.1:__API__;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
}
location /api/ {
    return 404;
}

# Totem e controle de acesso: única área que usa a câmera (reconhecimento facial). Repete os cabeçalhos porque
# add_header num location substitui os do nível de cima.
location ~ ^/(totem|acesso)(/|$) {
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    limit_req zone=mayafit___AMB___geral burst=60 nodelay;
    proxy_pass http://127.0.0.1:__WEB__;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
}

location / {
    limit_req zone=mayafit___AMB___geral burst=60 nodelay;
    proxy_pass http://127.0.0.1:__WEB__;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
}
